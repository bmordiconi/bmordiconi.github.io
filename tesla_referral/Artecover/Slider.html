<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teller-Slider</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f2f2f2;
    --ink: #111111;
    --muted: #6d6d6a;
    --rule: rgba(17, 17, 17, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #f2f2f2; /* Bühne bleibt hell, die Teller sind auf Hell abgestimmt */
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
  }
  .stage:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
  .canvas-host { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .canvas-host canvas { display: block; width: 100%; height: 100%; }

  .logo {
    position: absolute;
    z-index: 2;
    top: clamp(20px, 3.2vw, 44px);
    left: clamp(20px, 3.2vw, 44px);
    width: clamp(120px, 13vw, 200px);
    pointer-events: none;
  }
  .logo svg { display: block; width: 100%; height: auto; fill: var(--ink); }

  .nav {
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: clamp(20px, 3.2vw, 44px);
    transform: translateX(-50%);
    display: flex;
    gap: clamp(28px, 5vw, 64px);
  }
  .nav button {
    appearance: none;
    background: none;
    border: 0;
    padding: 12px 10px;
    color: var(--ink);
    cursor: pointer;
    line-height: 0;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #prev:hover { transform: translateX(-4px); }
  #next:hover { transform: translateX(4px); }
  .nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .nav button[disabled] { opacity: 0.25; cursor: default; transform: none; }

  .fallback {
    position: absolute; inset: 0; display: none; place-items: center;
    padding: 2rem; text-align: center; z-index: 4;
  }
  .no-webgl .fallback { display: grid; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>

    mesh.userData.index = pi;
    var spin = new THREE.Group(); spin.add(mesh);
    var group = new THREE.Group(); group.add(spin);
    var shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({
      map: shadowTex, transparent: true, depthWrite: false, fog: false, toneMapped: false
    }));
    shadow.position.set(0.06, -0.1, -0.3); shadow.renderOrder = -1;
    group.add(shadow);
    gallery.add(group);
    discs.push({
      index: pi, group: group, spin: spin, mesh: mesh, phase: pi * 1.9 + 0.7,
      bx: 0, by: 0, bz: 0, tx: 0, ty: 0, tvx: 0, tvy: 0,
      pushX: 0, pushY: 0, pushZ: 0, pushVX: 0, pushVY: 0, pushVZ: 0,
      pushRotX: 0, pushRotY: 0, pushRotVX: 0, pushRotVY: 0
    });
    pickables.push(mesh);
  }

  /* ------------------------------------------------------------------ *
   *  Zustand
   * ------------------------------------------------------------------ */
  var L = 0;          // Position der Galerie als Fließkomma-Index
  var Se = 0;         // Drag-Trägheit (Index pro 60-fps-Frame)
  var Te = 0;         // Geschwindigkeit der Einrast-Feder
  var Ce = 0;         // geglättete Gleitgeschwindigkeit (für Neigung)
  var prevL = 0;
  var tween = null;   // { from, to, t, dur, ease }
  var pending = -1;   // Ziel, solange ein Tween läuft
  var target = 0;

  var G = { active: 0, others: 0, inbound: true };
  var flying = !reduce;          // Intro läuft
  var introT = 0;
  if (reduce) { G.active = 1; G.others = 1; flying = false; }
  var firstLayout = true;

  var pointer = { x: 0, y: 0 };  // NDC der Maus über der Bühne
  var hovered = -1;
  var pressed = false, pressId = -1, dragging = false, isTouch = false;
  var startX = 0, startY = 0, lastX = 0, lastY = 0, lastT = 0;
  var moveStamp = 0, lastCX = 0, lastCY = 0, velX = 0, velY = 0;
  var pointerMoved = false;
  var suppressClickUntil = 0;
  var hit = null;
  var activeIndex = 0;

  var ray = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var wr = { x: 0, y: 0 };

  function updateNDC(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    ndc.x = (x / r.width) * 2 - 1;
    ndc.y = -(y / r.height) * 2 + 1;
    pointer.x = ndc.x; pointer.y = ndc.y;
    return { x: x, y: y, rect: r };
  }
  function pick() {
    var list = [];
    for (var i = 0; i < discs.length; i++) if (discs[i].group.visible) list.push(discs[i].mesh);
    ray.setFromCamera(ndc, camera);
    var h = ray.intersectObjects(list, false)[0];
    if (!h) { hit = null; return -1; }
    hit = h;
    var lp = h.object.worldToLocal(h.point.clone());
    wr.x = clamp(lp.x, -1, 1); wr.y = clamp(lp.y, -1, 1);
    return h.object.userData.index;
  }

  /* ------------------------------------------------------------------ *
   *  Navigation (weiches Gleiten wie in der Referenz)
   * ------------------------------------------------------------------ */
  function currentTarget() {
    if (pending >= 0) return clamp(pending, 0, N - 1);
    if (tween) return clamp(target, 0, N - 1);
    return clamp(Math.round(L), 0, N - 1);
  }
  function navParams(source, dist) {
    var n = W.snapDuration;
    switch (source) {
      case 'wheel': return { duration: n + 0.05, ease: glide, kick: 2.5 };
      case 'key':   return { duration: Math.min(0.6, n - 0.04 + dist * 0.05), ease: glide, kick: 4 };
      case 'click': return { duration: clamp(0.45 + dist * 0.11, n, 1.05), ease: glide, kick: Math.min(5, dist * 1.4) };
      case 'flick': return { duration: n + 0.1, ease: glide, kick: 0 };
      default:      return { duration: n, ease: power3out, kick: 0 };
    }
  }
  function goTo(idx, opts) {
    opts = opts || {};
    var n = clamp(idx, 0, N - 1);
    var dist = Math.abs(n - L);
    var p = navParams(opts.source || 'snap', dist);
    target = n; pending = n; Se = 0; Te = 0; tween = null;
    if (reduce) { L = n; prevL = n; Ce = 0; pending = -1; return; }
    if (p.kick) {
      var s = Math.sign(n - L);
      if (s) Ce = clamp(Ce + s * p.kick, -12, 12);
    }
    tween = { from: L, to: n, t: 0, dur: p.duration, ease: p.ease };
  }

  /* ------------------------------------------------------------------ *
   *  Hover: "Wipe"-Impuls beim Überfahren, Druck-Impuls beim Klick
   * ------------------------------------------------------------------ */
  function wipe(i) {
    var d = discs[i];
    if (!d || flying || reduce) return;
    if (Math.hypot(velX, velY) < W.wipeMinSpeed) return;
    var pn = W.wipePushMax, rn = W.wipeSpinMax;
    d.pushVX += clamp(velX * W.wipePush, -pn, pn);
    d.pushVY -= clamp(velY * W.wipePush, -pn, pn);
    d.pushRotVY += clamp(velX * W.wipeSpin, -rn, rn);
    d.pushRotVX += clamp(velY * W.wipeSpin, -rn, rn);
  }
  function press(i) {
    var d = discs[i];
    if (!d || flying || reduce) return;
    d.pushVZ -= W.pressDepth;
    d.pushRotVY += wr.x * W.pressTilt;
    d.pushRotVX -= wr.y * W.pressTilt;
  }
  function updateCursor() {
    if (dragging) stage.style.cursor = 'grabbing';
    else stage.style.cursor = hovered >= 0 ? 'pointer' : 'grab';
  }

  /* ------------------------------------------------------------------ *
   *  Zeiger: Ziehen (der Teller selbst dreht sich NICHT)
   * ------------------------------------------------------------------ */
  var NO_DRAG = 'a, button, input, textarea, select, [data-no-drag]';

  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || !e.isPrimary) return;
    if (e.target.closest && e.target.closest(NO_DRAG)) return;
    var t = updateNDC(e);
    pressed = true; pressId = e.pointerId; dragging = false;
    isTouch = e.pointerType !== 'mouse';
    startX = lastX = t.x; startY = lastY = t.y; lastT = performance.now();
    hovered = pick();
    pointer.x = ndc.x; pointer.y = ndc.y;
    window.addEventListener('pointermove', onDragMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    updateCursor();
  });

  function beginDrag(e) {
    dragging = true;
    tween = null; pending = -1;
    Se = 0; Te = 0;
    stage.style.cursor = 'grabbing';
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  }

  function onDragMove(e) {
    if (!pressed || e.pointerId !== pressId) return;
    var t = updateNDC(e);
    if (!dragging) {
      if (Math.hypot(t.x - startX, t.y - startY) < W.dragStartDistance) return;
      beginDrag(e);
    }
    if (e.cancelable) e.preventDefault();
    var now = performance.now();
    var dx = t.x - lastX;
    var a = Math.max(8, now - lastT);
    lastX = t.x; lastY = t.y; lastT = now;
    var span = isTouch ? W.touchSpan : 6 * W.dragSensitivity;
    var step = -(dx / t.rect.width) * span;
    L = clamp(L + step, 0, N - 1);
    var c = clamp((16.667 / a) * step, -W.dragMaxVelocity, W.dragMaxVelocity);
    Se += (c - Se) * W.dragVelocitySmoothing;
    target = Math.round(L);
  }

  function endPress(cancelled) {
    if (!pressed) return;
    var wasDragging = dragging;
    var id = pressId;
    pressed = false; pressId = -1; dragging = false;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    try { if (stage.hasPointerCapture(id)) stage.releasePointerCapture(id); } catch (_) {}
    updateCursor();
    if (!wasDragging) return;
    suppressClickUntil = performance.now() + 140;
    if (cancelled) { Se = 0; goTo(Math.round(L)); return; }
    if (isTouch) {
      var dir = Math.abs(Se) >= W.touchFlickVelocity ? Math.sign(Se) : 0;
      var idx = dir > 0 ? Math.floor(L) + 1 : dir < 0 ? Math.ceil(L) - 1 : Math.round(L);
      Se = 0;
      goTo(clamp(idx, 0, N - 1), { source: 'flick' });
    }
    // Maus: Trägheit läuft aus, danach rastet die Feder ein
  }
  function onUp() { endPress(false); }
  function onCancel() { endPress(true); }

  // Hover ohne gedrückte Taste
  stage.addEventListener('pointermove', function (e) {
    if (pressed) return;
    updateNDC(e);
    var now = performance.now(), dt = now - moveStamp;
    moveStamp = now;
    if (dt < 120) {
      var k = 16.7 / Math.max(8, dt);
      velX = (e.clientX - lastCX) * k; velY = (e.clientY - lastCY) * k;
    } else { velX = 0; velY = 0; }
    lastCX = e.clientX; lastCY = e.clientY;
    pointerMoved = true;
  });
  stage.addEventListener('pointerleave', function () {
    if (!pressed) { hovered = -1; pointerMoved = false; updateCursor(); }
  });

  stage.addEventListener('click', function (e) {
    if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
    if (e.target.closest && e.target.closest('button, a')) return;
    updateNDC(e);
    var idx = pick();
    if (idx < 0) return;
    if (idx !== activeIndex) {
      press(idx); goTo(idx, { source: 'click' });
    } else {
      press(idx);
    }
  });

  /* ------------------------------------------------------------------ *
   *  Tastatur + Buttons
   * ------------------------------------------------------------------ */
  window.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.metaKey || e.ctrlKey) return;
    var t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    var cur = currentTarget(), to = cur;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') to = cur + 1;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') to = cur - 1;
    else if (e.key === 'Home') to = 0;
    else if (e.key === 'End') to = N - 1;
    else return;
    e.preventDefault();
    to = clamp(to, 0, N - 1);
    if (to !== cur) { goTo(to, { source: 'key' }); }
  });
  var btnPrev = document.getElementById('prev'), btnNext = document.getElementById('next');
  btnPrev.addEventListener('click', function () { var c = currentTarget(); if (c > 0) { goTo(c - 1, { source: 'key' }); } });
  btnNext.addEventListener('click', function () { var c = currentTarget(); if (c < N - 1) { goTo(c + 1, { source: 'key' }); } });

  /* ------------------------------------------------------------------ *
   *  Zustand der Buttons + Ansage für Screenreader
   * ------------------------------------------------------------------ */
  var elLive = document.getElementById('live');
  function setPanel(i) {
    btnPrev.disabled = i === 0; btnNext.disabled = i === N - 1;
    elLive.textContent = 'Teller ' + (i + 1) + ' von ' + N + ', ' + GLAZES[i].name;
  }
  setPanel(0);

  /* ------------------------------------------------------------------ *
   *  Layout pro Frame (Positionen, Neigung, Hover-Schwenken, Impulse)
   * ------------------------------------------------------------------ */
  var floatT = 0;
  function layout(dt) {
    floatT += dt;
    var n = clamp(Math.round(L), 0, N - 1);
    var live = !flying && !reduce;
    var lean = live ? clamp(Math.sign(Ce) * Math.sqrt(Math.abs(Ce)) * W.flowLean, -W.flowLeanMax, W.flowLeanMax) : 0;
    var dip = live ? Math.min(W.flowDipMax, Math.abs(Ce) * W.flowDip) : 0;
    var sBase = dragging ? W.followTight : W.followBase;
    var v = Math.max(0.12, W.depthGap);

    for (var p = 0; p < discs.length; p++) {
      var d = discs[p];
      var m = p - L, h = Math.abs(m), g = p === n, ang = m * 0.35;

      var X = Math.sin(ang) * W.hGap * 2.4;
      var Y = (g ? W.activeDiscY : 0) - dip * (g ? 0.7 : 1);
      var Z = -Math.cos(ang) * v * 2.4 + v * 2.4;
      var rx = 0, ry = -ang + lean * (g ? 1 : 1.12), rz = -lean * W.flowBank * (g ? 0.7 : 1);

      var base = g ? 1 : Math.max(W.inactiveScale, 1 - h * (1 - W.inactiveScale) * 0.6);
      var sc, vis = true;
      if (g) {
        sc = base * G.active;
      } else {
        var e = clamp(G.others, 0, 2);
        var st = clamp(G.inbound ? W.flightStaggerIn : 0.45, 0, 0.9);
        var rr = Math.max(1, Math.round(W.flightStaggerMax));
        var off = (Math.min(h, rr) / rr) * st;
        var span = Math.max(0.1, 1 - st);
        var o = clamp((Math.min(1, e) - off) / span, 0, 1);
        var s = (G.inbound ? glide(o) : o * (2 - o)) + Math.max(0, e - 1);
        vis = s > (G.inbound ? W.flightPopScaleIn : 0.35);
        sc = base * s;
        var c = 1 - Math.min(1, s);
        if (c > 1e-4) Z -= c * W.flightRecede;
      }
      d.group.visible = vis;

      // Dauerhaftes, sehr langsames Schweben (pro Teller versetzt)
      if (!reduce) {
        var ph = d.phase, fa = W.floatAmp;
        X  += Math.sin(floatT * 0.37 + ph * 1.7) * 0.02 * fa;
        Y  += Math.sin(floatT * 0.55 + ph) * 0.035 * fa;
        rx += Math.sin(floatT * 0.43 + ph * 2.3) * 0.035 * fa;
        ry += Math.sin(floatT * 0.31 + ph * 0.9) * 0.045 * fa;
        rz += Math.sin(floatT * 0.27 + ph * 1.3) * 0.025 * fa;
      }

      // Hover-Schwenken: gedämpfte Feder statt linearem Nachziehen, dadurch
      // beginnt und endet die Neigung sanft (Ease-in-out)
      var hv = (hovered === p && !reduce && !flying) ? 1 : 0;
      var tgx = hv * W.hoverTiltStrength * pointer.y, tgy = hv * W.hoverTiltStrength * pointer.x;
      var ke = W.hoverEase;
      d.tvx += (tgx - d.tx) * ke * ke * dt; d.tvx *= Math.exp(-2 * ke * dt); d.tx += d.tvx * dt;
      d.tvy += (tgy - d.ty) * ke * ke * dt; d.tvy *= Math.exp(-2 * ke * dt); d.ty += d.tvy * dt;

      var k = clamp(sBase - h * W.followFalloff, W.followMin, W.followTight);
      var A = (flying || firstLayout) ? 1 : Math.min(1, dt * k);

      // Federnde Impulse (Wipe / Druck)
      if (flying || reduce) {
        d.pushX = d.pushY = d.pushZ = d.pushVX = d.pushVY = d.pushVZ = 0;
        d.pushRotX = d.pushRotY = d.pushRotVX = d.pushRotVY = 0;
      } else {
        var sum = Math.abs(d.pushX) + Math.abs(d.pushY) + Math.abs(d.pushZ) +
                  Math.abs(d.pushVX) + Math.abs(d.pushVY) + Math.abs(d.pushVZ) +
                  Math.abs(d.pushRotX) + Math.abs(d.pushRotY) + Math.abs(d.pushRotVX) + Math.abs(d.pushRotVY);
        if (sum > 8e-4) {
          var damp = Math.exp(-W.pushDamping * dt), back = Math.min(1, dt * W.pushReturn);
          d.pushX += d.pushVX * dt; d.pushVX *= damp;
          d.pushY += d.pushVY * dt; d.pushVY *= damp;
          d.pushZ += d.pushVZ * dt; d.pushVZ *= damp;
          d.pushRotX += d.pushRotVX * dt; d.pushRotVX *= damp;
          d.pushRotY += d.pushRotVY * dt; d.pushRotVY *= damp;
          d.pushX -= d.pushX * back; d.pushY -= d.pushY * back; d.pushZ -= d.pushZ * back;
          d.pushRotX -= d.pushRotX * back; d.pushRotY -= d.pushRotY * back;
          X += d.pushX; Y += d.pushY; Z += d.pushZ;
        } else if (sum > 0) {
          d.pushX = d.pushY = d.pushZ = d.pushVX = d.pushVY = d.pushVZ = 0;
          d.pushRotX = d.pushRotY = d.pushRotVX = d.pushRotVY = 0;
        }
      }

      var gp = d.group;
      gp.position.x += (X - gp.position.x) * A;
      gp.position.y += (Y - gp.position.y) * A;
      gp.position.z += (Z - gp.position.z) * A;
      var cs = gp.scale.x + (sc - gp.scale.x) * A;
      gp.scale.setScalar(Math.max(cs, 0.0001));
      d.bx += (rx - d.bx) * A; d.by += (ry - d.by) * A; d.bz += (rz - d.bz) * A;
      gp.rotation.x = d.bx + d.tx;
      gp.rotation.y = d.by + d.ty;
      gp.rotation.z = d.bz;

      d.spin.rotation.x = d.pushRotX;
      d.spin.rotation.y = d.pushRotY;
    }
    firstLayout = false;
  }

  /* ------------------------------------------------------------------ *
   *  Frame-Schleife
   * ------------------------------------------------------------------ */
  function resize() {
    var w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Hochformat: weiter zurück, damit der Teller ins Bild passt
    var dist = Math.max(W.cameraDistance, 3.4 / camera.aspect);
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    scene.fog.near = dist + 2.6; scene.fog.far = dist + 9.6;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var real = (now - last) / 1000; last = now;
    step(Math.min(0.05, Math.max(0.0001, real)));
    renderer.render(scene, camera);
  }

  // Ein Simulationsschritt (ohne Rendern), damit sich die Bewegung exakt testen lässt
  function step(dt) {
    var r = Math.min(3, dt * 60);

    // Intro: Teller fliegen nacheinander ein
    if (flying) {
      introT += dt;
      var dur = 0.7;
      G.active = Math.max(0.001, glide(Math.min(1, introT / dur)));
      G.others = clamp((introT - dur * 0.1) / (dur * 0.85), 0, 1);
      if (introT >= dur * 0.95 + 0.1) { flying = false; G.active = 1; G.others = 1; G.inbound = false; }
    }

    // Hover-Wechsel erkennen (nur wenn Maus bewegt wurde)
    if (pointerMoved) {
      pointerMoved = false;
      var idx = pick();
      if (idx !== hovered) {
        if (idx >= 0 && !pressed) wipe(idx);
        hovered = idx; updateCursor();
      }
    }

    // Tween (Rad, Tasten, Klick, Flick)
    if (tween) {
      tween.t += dt;
      var pr = Math.min(1, tween.t / tween.dur);
      L = tween.from + (tween.to - tween.from) * tween.ease(pr);
      if (pr >= 1) { L = tween.to; tween = null; pending = -1; }
    }

    // Trägheit nach dem Ziehen, danach Einrast-Feder (leichtes Nachschwingen)
    if (!dragging) {
      if (Math.abs(Se) > 1e-5) {
        L += Se * r;
        Se *= reduce ? 0 : Math.pow(W.friction, r);
        if (Math.abs(Se) < 4e-4) Se = 0;
      }
      if (Se === 0 && !tween) {
        var e = Math.round(L), t = e - L;
        if (reduce) {
          L += t * Math.min(1, dt * 20); Te = 0;
          if (Math.abs(e - L) < 0.001) L = e;
        } else if (t !== 0 || Math.abs(Te) > 1e-5) {
          Te += t * W.snapFreq * W.snapFreq * dt;
          Te *= Math.exp(-W.snapDamping * dt);
          L += Te * dt;
          if (Math.abs(e - L) < 8e-4 && Math.abs(Te) < 0.004) { L = e; Te = 0; }
        }
      }
    }
    L = clamp(L, -0.05, N - 0.95);

    // Gleitgeschwindigkeit -> Neigung der Teller beim Sliden
    if (reduce || flying) { Ce = 0; prevL = L; }
    else {
      var vel = clamp((L - prevL) / Math.max(dt, 0.001), -40, 40);
      prevL = L;
      var rate = Math.abs(vel) > Math.abs(Ce) ? 14 : 6;
      Ce += (vel - Ce) * Math.min(1, dt * rate);
      if (Math.abs(Ce) < 0.01) Ce = 0;
    }

    var ai = clamp(Math.round(L), 0, N - 1);
    if (ai !== activeIndex) { activeIndex = ai; setPanel(ai); }

    layout(dt);
  }
  requestAnimationFrame(frame);

  // Zum Testen / Feintuning in der Konsole erreichbar
  window.plateSlider = {
    W: W, goTo: goTo, step: step, discs: discs, pointer: pointer,
    get position() { return L; }, get lean() { return Ce; }
  };
})();
</script>
</body>
</html>
